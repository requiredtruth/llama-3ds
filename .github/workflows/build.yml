name: build-3dsx

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20260610
    steps:
      - uses: actions/checkout@v4
      - name: Build llama-3ds.3dsx
        run: make -j2
      - name: Verify artifact
        run: test -s llama-3ds.3dsx
      - uses: actions/upload-artifact@v4
        with:
          name: llama-3ds-3dsx
          path: |
            llama-3ds.3dsx
            llama-3ds.smdh
